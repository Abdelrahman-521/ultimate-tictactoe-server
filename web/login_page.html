<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
    body {
    text-align: center;
  }

  .intro {
    color: #000000;
    width: 50%;
    margin: 0 auto 50px;
  }

  h1 {
    font-size: 70px;
    line-height: 1;
    margin-bottom: 20px;
  }

  #instruct {
    margin-bottom: 0;
  }

  #instruct-text {
    display: block;
    margin-top: 5px;
  }

  .grid {
    display: grid;
    grid-template-columns: auto auto auto;
    grid-template-rows: auto auto auto;
    justify-content: center;
    align-content: center;
    color: #000000;
    margin-bottom: 100px;
  }

   .exterior {
     background-color: #ffffff;
     font-size: 35px;
     padding: 20px;
     max-width: 180px;
     width: 20vw;
     max-height: 180px;
     height: 20vw;
     border: 4px solid #000000;
     display: grid;
     grid-template-columns: auto auto auto;
     grid-template-rows: auto auto auto;
     align-items: center;
     justify-content: center;
  }

  .interior {
    display: flex;
    flex-direction: column;
    max-width: 60px;
    width: 6vw;
    max-height: 60px;
    height: 6vw;
    border: 2px solid #000000;
    align-items: center;
    justify-content: center;
  }

  .played {
    display: block;
    font-size: 130px;
  }

  @media (max-width: 500px) {
    .intro {
      width: 90%;
      margin-bottom: 0;
    }

    h1 {
      font-size: 40px;
    }

    h2 {
      font-size: 20px;
      margin: 10px auto 0;
    }

    .player p {
      font-size: 15px;
      margin-top: 0;
    }

    .interior {
      font-size: 20px;
    }

    .played {
      font-size: 80px;
    }
  }
  </style>
</head>
<body>
    <div id="loginForm">
        <h1>Login</h1>
        <form method="POST" action="/login">
        <form>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username"><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"><br>
            <button type="submit" name="login">Login</button>
        </form>
    </div>
    <hr>
    <div id="changePasswordForm"> Forgot your password?
        <a href="password_renew_page.html">Change Password</a>
    </div>
</div>
    <div id="newUser">Are you a new player? Register <a href="registration_page.html">here</a></div>

    </div>
</body>
</html>
</html>
