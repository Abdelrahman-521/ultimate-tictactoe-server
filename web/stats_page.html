<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player Statistics</title>
    <link href='main.style.css' rel='stylesheet'>
</head>
<body>
    <h1>Player Statistics</h1>
    <button onclick="showPlayerStats('Player 1 History')">Player 1</button>
    <button onclick="showPlayerStats('Player 2 History')">Player 2</button>

    <div id="stats"></div>

    <script>
        function showPlayerStats(player) {
            // For demonstration purposes, I'm just displaying dummy data here
            var stats = {
                wins: 5,
                losses: 3,
                gamesPlayed: 8
            };

            var statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = `<h2>${player}</h2>
                                <p>Wins: ${stats.wins}</p>
                                <p>Losses: ${stats.losses}</p>
                                <p>Games Played: ${stats.gamesPlayed}</p>`;
        }
    </script>
</body>
</html>
